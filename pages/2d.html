<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Optimizer - EAV Cutting Optimizer</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/optimizer.css" />
    <link rel="stylesheet" href="../css/modal.css" />
    <link rel="stylesheet" href="../css/loading.css" />
    <link rel="stylesheet" href="../css/accessibility.css" />
    <link rel="stylesheet" href="../css/animations.css" />
</head>
<body class="page-optimizer">
    
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <span class="logo logo-static" aria-label="2D Optimizer">
                    <svg class="logo-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 4h16v16H4z" />
                    </svg>
                </span>
                <div class="header-text">
                    <h1 class="header-title">2D Optimizer</h1>
                    <p class="header-subtitle">Sheet material cutting</p>
                </div>
            </div>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="../index.html" class="nav-link" aria-label="Home">Home</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content page-transition-in" id="main-content">
        <div class="content-container">
            <!-- 2D Optimizer Form -->
            <div id="optimizer-2d-form">
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title-group">
                            <svg class="panel-icon settings-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <h2 class="panel-title">Parameters</h2>
                        </div>
                    </div>
                    <div class="panel-content">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="plate-width" class="form-label">
                                    Plate Width (mm)
                                </label>
                                <input type="number" id="plate-width" class="form-input numeric-only" placeholder="Enter width in mm" value="2440" min="1" 
                                       aria-label="Plate width in millimeters" />
                            </div>
                            <div class="form-group">
                                <label for="plate-height" class="form-label">
                                    Plate Height (mm)
                                </label>
                                <input type="number" id="plate-height" class="form-input numeric-only" placeholder="Enter height in mm" value="1220" min="1" 
                                       aria-label="Plate height in millimeters" />
                            </div>
                            <div class="form-group">
                                <label for="kerf-width-2d" class="form-label">Kerf Width (mm)</label>
                                <input type="number" id="kerf-width-2d" class="form-input numeric-only" value="3" min="0">
                            </div>
                            <div class="form-group full-width">
                                <label for="algorithm-2d" class="form-label">
                                    Algorithm
                                </label>
                                <select id="algorithm-2d" class="form-select" aria-label="Optimization algorithm">
                                    <option value="GUILLOTINE">Guillotine (for saws)</option>
                                    <option value="MAXRECTS">MaxRects (tight packing)</option>
                                    <option value="SIMPLE">Simple (fastest)</option>
                                </select>
                            </div>
                        </div>

                        <div class="cut-list-section">
                            <div class="cut-list-header">
                                <h3 class="cut-list-title">Cut List</h3>
                                <button type="button" class="btn btn-add" id="add-item-2d" aria-label="Add new cut item">
                                    <svg class="icon-plus" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                    </svg>
                                    Add Item
                                </button>
                            </div>
                            <div class="items-container" id="items-container-2d" role="list"></div>
                        </div>

                        <button type="button" class="btn btn-primary btn-full" id="optimize-2d" aria-label="Start optimization">
                            <svg class="icon-bolt" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                            Optimize
                        </button>
                    </div>
                </div>
            </div>

            <!-- 2D Optimizer Results -->
            <div id="optimizer-2d-results" class="results-container hidden"></div>
        </div>
    </main>

    <!-- Loading Spinner -->
    <div id="loading-overlay" class="loading-overlay hidden" role="status">
        <div class="loading-spinner">
            <svg class="spinner" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="spinner-path" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="loading-text">Optimizing...</p>
        </div>
    </div>

    <!-- Donation Modal -->
    <div id="donation-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Support This Project</h2>
                <button class="modal-close" id="modal-close" aria-label="Close modal">
                    <svg class="icon-close" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="modal-description">This website is free to use. Please consider donating to support development.</p>
                <div class="qr-container">
                    <img src="../assets/img/qr-code.png" alt="QRIS Donation Code" class="qr-image" />
                </div>
                <div class="modal-footer-text">
                    <p class="company-name">FIRST HAS TO BE SKETCHED, DIGITAL & KREATIF</p>
                    <p class="nmid">NMID: ID1026473908725</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer footer-fixed">
        <div class="footer-container">
            <p class="footer-text">Engineered by Eghy Al Vandi</p>
            <button class="btn btn-donate" id="donate-btn-2d" aria-label="Support with donation">
                <svg class="icon-heart" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" />
                </svg>
                Donate
            </button>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script src="../js/pdf-export.js"></script>
    <script src="../js/2d-optimizer.js"></script>
</body>
</html>
